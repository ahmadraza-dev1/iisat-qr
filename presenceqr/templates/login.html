{% extends 'base.html' %}

{% block title %}
Sign in · IISAT QR
{% endblock %}

{% block content %}

<div class="center-page">

    <section class="auth-card">

        <span class="eyebrow">
            Login Page
        </span>

        <h1>
            Welcome back.
        </h1>

        <p>
            Use your teacher email or staff ID.
        </p>

        <form
            class="stack"
            method="post"
        >

            <label>
                Email / Staff ID

                <input
                    name="identity"
                    required
                    autocomplete="username"
                    placeholder="admin@iisat.edu.pk"
                >
            </label>

            <label>
                Password

                <input
                    name="password"
                    type="password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••"
                >
            </label>

            <button
                class="btn primary wide"
                type="submit"
            >
                Sign in →
            </button>

</div>

{% endblock %}
