{% extends 'base.html' %}

{% block title %}Settings · IISAT QR{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <span class="eyebrow">SYSTEM SETTINGS</span>
    <h1>Department Settings</h1>
    <p>Configure branding and the attendance threshold used for alerts.</p>
  </div>
</div>

<section class="panel">
  <form class="grid-form" method="post">
    <label class="span2">
      University / Institute Name
      <input name="university_name" value="{{ university_name }}" required>
    </label>

    <label>
      Attendance Threshold (%)
      <input
        type="number"
        name="attendance_threshold"
        min="0"
        max="100"
        step="0.1"
        value="{{ attendance_threshold }}"
        required
      >
    </label>

    <div class="span2">
      <button class="btn primary">Save Settings</button>
    </div>
  </form>
</section>
{% endblock %}
