services:
  - type: web
    name: iisat-qr
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iisat-qr-db
          property: connectionString
      - key: QR_ROTATION_SECONDS
        value: 25
      - key: COOKIE_SECURE
        value: 1
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEFAULT_ADMIN_ID
        value: ADMIN-001
      - key: DEFAULT_ADMIN_NAME
        value: IISAT Administrator
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@iisat.edu.pk
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

databases:
  - name: iisat-qr-db
    plan: free
    region: singapore
